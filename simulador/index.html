    window.EMBEDDED_CHEAT_SHEET = "# ⚡ GUIA RÁPIDO & SUPER FORMULÁRIO DE P2 (FÍSICA 2)\n> **Como usar:** Estude e resolva as primeiras provas consultando esta \"colinha de bolso\". Quando estiver seguro, faça os simulados usando apenas o formulário oficial que vem na capa da prova!\n\n---\n\n## 📌 1. CORRENTE ELÉTRICA, RESISTÊNCIA & POTÊNCIA\n\n### Fórmulas Essenciais:\n* **Corrente e Densidade:**\n  $$I = \\frac{dq}{dt} = \\int \\vec{J} \\cdot d\\vec{A} = J \\cdot A \\quad (\\text{se uniforme})$$\n  $$\\vec{J} = n q \\vec{v}_d = \\sigma \\vec{E} = \\frac{\\vec{E}}{\\rho}$$\n  *(onde $n$ = densidade de portadores $/m^3$, $v_d$ = velocidade de deriva, $\\sigma$ = condutividade, $\\rho$ = resistividade)*\n\n* **Resistência e Lei de Ohm:**\n  $$R = \\frac{V}{I} \\qquad R = \\rho \\frac{L}{A}$$\n  * Variação com temperatura: $\\rho(T) = \\rho_0 [1 + \\alpha(T - T_0)]$\n\n* **Potência Elétrica:**\n  $$P = V \\cdot I = I^2 R = \\frac{V^2}{R}$$\n\n* **Gerador Real (Bateria com resistência interna $r$):**\n  * Fornecendo corrente (descarga): $V = \\mathcal{E} - I r$\n  * Sendo carregada: $V = \\mathcal{E} + I r$\n\n---\n\n## 📌 2. CIRCUITOS DC & REGRAS DE KIRCHHOFF\n\n### Associações:\n* **Resistores:**\n  * **Série:** $R_{eq} = R_1 + R_2 + \\dots$ (mesma corrente $I$)\n  * **Paralelo:** $\\frac{1}{R_{eq}} = \\frac{1}{R_1} + \\frac{1}{R_2} + \\dots \\implies R_{eq} = \\frac{R_1 R_2}{R_1 + R_2}$ (mesma ddp $V$)\n\n### Regras de Kirchhoff:\n1. **Lei dos Nós (Carga):** $\\sum I_{entra} = \\sum I_{sai}$\n2. **Lei das Malhas (Energia):** $\\sum \\Delta V = 0$\n   * No sentido da corrente no resistor: $-IR$\n   * Contra o sentido da corrente no resistor: $+IR$\n   * Do polo $-$ para $+$ da bateria: $+\\mathcal{E}$\n   * Do polo $+$ para $-$ da bateria: $-\\mathcal{E}$\n\n---\n\n## 📌 3. CIRCUITOS RC (CARGA E DESCARGA)\n\n* **Constante de tempo:** $\\tau = R C$ (em segundos)\n* **Energia no capacitor:** $U = \\frac{1}{2} C V^2 = \\frac{q^2}{2C} = \\frac{1}{2} q V$\n\n### 🔋 Carga do Capacitor (com bateria $\\mathcal{E}$):\n* **Carga:** $q(t) = C\\mathcal{E} \\left(1 - e^{-t/\\tau}\\right) = Q_{max} \\left(1 - e^{-t/\\tau}\\right)$\n* **Tensão no Capacitor:** $V_C(t) = \\mathcal{E} \\left(1 - e^{-t/\\tau}\\right)$\n* **Corrente & Tensão no Resistor:** $I(t) = \\frac{\\mathcal{E}}{R} e^{-t/\\tau} = I_0 e^{-t/\\tau} \\quad \\text{e} \\quad V_R(t) = \\mathcal{E} e^{-t/\\tau}$\n\n### 🪫 Descarga do Capacitor (sem bateria, a partir de $Q_0$):\n* $q(t) = Q_0 e^{-t/\\tau}$\n* $V_C(t) = V_0 e^{-t/\\tau}$\n* $I(t) = \\frac{Q_0}{\\tau} e^{-t/\\tau} = I_0 e^{-t/\\tau}$\n\n> 💡 **Comportamento Assintótico (MUITO COBRADO EM TEORIA):**\n> * **No instante inicial ($t = 0^+$):** Capacitor descarregado age como um **Fio / Curto-circuito** ($V_C = 0$).\n> * **No regime estacionário ($t \\to \\infty$):** Capacitor totalmente carregado age como uma **Chave Aberta** ($I_C = 0$, corrente não passa pelo ramo do capacitor).\n\n---\n\n## 📌 4. CAMPO MAGNÉTICO ($\\vec{B}$) & FORÇA MAGNÉTICA\n\n### Força de Lorentz sobre Carga Móvel:\n$$\\vec{F}_B = q (\\vec{v} \\times \\vec{B}) \\implies |\\vec{F}_B| = |q| v B \\sin\\theta$$\n* ⚠️ **A força magnética NUNCA realiza trabalho sobre carga livre:** $W_B = 0 \\implies \\Delta K = 0$ (a velocidade escalar $v$ e a energia cinética são sempre constantes; altera apenas a direção do movimento).\n\n### Movimento Circular Uniforme em $\\vec{B}$ uniforme ($\\vec{v} \\perp \\vec{B}$):\n* **Raio:** $R = \\frac{m v}{|q| B} = \\frac{p}{|q| B} = \\frac{\\sqrt{2m K}}{|q| B}$\n* **Período e Frequência:** $T = \\frac{2\\pi m}{|q| B} \\quad (\\text{não depende de } v \\text{ nem de } R!) \\qquad \\omega = \\frac{|q| B}{m}$\n* **Passo da hélice** (se houver $v_\\parallel = v \\cos\\theta$): $p = v_\\parallel \\cdot T$\n\n### Dispositivos Especiais:\n* **Seletor de Velocidades:** $\\vec{F}_E + \\vec{F}_B = 0 \\implies v = \\frac{E}{B}$\n* **Efeito Hall:** $V_H = E_H \\cdot d = \\frac{I B}{n q t}$ *(onde $t$ é a espessura da fita e $d$ é a largura)*. O sinal de $V_H$ indica se os portadores são positivos ($+$) ou elétrons ($-$).\n\n---\n\n## 📌 5. FORÇA EM CONDUTORES & MOMENTO DE DIPOLO\n\n* **Força sobre Fio com Corrente:**\n  $$d\\vec{F} = I (d\\vec{l} \\times \\vec{B}) \\implies \\vec{F} = I (\\vec{L} \\times \\vec{B}) \\quad (\\text{para fio reto em campo uniforme})$$\n  * Em qualquer espira fechada imersa em campo $\\vec{B}$ uniforme: $\\vec{F}_{total} = \\oint I d\\vec{l} \\times \\vec{B} = \\vec{0}$.\n\n* **Momento de Dipolo Magnético ($\\vec{\\mu}$):**\n  $$\\vec{\\mu} = N I \\vec{A} \\quad (\\text{RMD: dedos no sentido de } I \\implies \\text{polegar no sentido de } \\vec{\\mu})$$\n\n* **Torque & Energia Potencial em Espiras:**\n  $$\\vec{\\tau} = \\vec{\\mu} \\times \\vec{B} \\implies |\\tau| = \\mu B \\sin\\theta$$\n  $$U = -\\vec{\\mu} \\cdot \\vec{B} = -\\mu B \\cos\\theta$$\n  * **Equilíbrio Estável:** $\\vec{\\mu} \\parallel \\vec{B}$ ($\\theta = 0^\\circ \\implies U = -\\mu B$, torque nulo).\n  * **Equilíbrio Instável:** $\\vec{\\mu}$ antiparalelo a $\\vec{B}$ ($\\theta = 180^\\circ \\implies U = +\\mu B$, torque nulo).\n\n---\n\n## 📌 6. FONTES DE CAMPO MAGNÉTICO (BIOT-SAVART & AMPÈRE)\n\n> Constante: $\\mu_0 = 4\\pi \\times 10^{-7}\\text{ T}\\cdot\\text{m/A}$\n\n### Lei de Biot-Savart:\n$$d\\vec{B} = \\frac{\\mu_0 I}{4\\pi} \\frac{d\\vec{s} \\times \\hat{r}}{r^2}$$\n\n### 🌟 Geometrias Clássicas de Campo Magnético (Grave estas!):\n1. **Fio Retilíneo Infinito:**\n   $$B = \\frac{\\mu_0 I}{2\\pi r}$$\n2. **Arco Circular de Raio $R$ e Ângulo $\\phi$ (radianos) no Centro:**\n   $$B = \\frac{\\mu_0 I \\phi}{4\\pi R} \\implies \\begin{cases} \\text{Espira completa } (\\phi = 2\\pi): & B = \\frac{\\mu_0 I}{2 R} \\\\ \\text{Semi-círculo } (\\phi = \\pi): & B = \\frac{\\mu_0 I}{4 R} \\end{cases}$$\n3. **No Eixo de um Anel/Espira de Raio $R$ a uma distância $z$ do centro:**\n   $$B(z) = \\frac{\\mu_0 I R^2}{2 (R^2 + z^2)^{3/2}} = \\frac{\\mu_0 \\mu}{2\\pi (R^2 + z^2)^{3/2}}$$\n4. **Força entre Fios Paralelos de comprimento $L$ separados por $d$:**\n   $$\\frac{F}{L} = \\frac{\\mu_0 I_1 I_2}{2\\pi d} \\implies \\begin{cases} \\text{Correntes no MESMO sentido} & \\to \\text{\\textbf{ATRAÇÃO}} \\\\ \\text{Correntes em sentidos OPOSTOS} & \\to \\text{\\textbf{REPULSÃO}} \\end{cases}$$\n\n### Lei de Ampère:\n$$\\oint \\vec{B} \\cdot d\\vec{s} = \\mu_0 I_{envolvida}$$\n\n1. **Fio Cilindro Maciço de Raio $R$ com corrente uniforme:**\n   * Fora ($r \\ge R$): $B(r) = \\frac{\\mu_0 I}{2\\pi r}$\n   * Dentro ($r < R$): $B(r) = \\frac{\\mu_0 I r}{2\\pi R^2} \\quad (\\text{cresce linearmente com } r)$\n2. **Solenoide Ideal Longo ($n = N/L$ espiras/metro):**\n   $$B_{interno} = \\mu_0 n I = \\mu_0 \\frac{N}{L} I \\qquad (B_{externo} \\approx 0)$$\n3. **Toroide de $N$ espiras:**\n   $$B(r) = \\frac{\\mu_0 N I}{2\\pi r} \\quad (\\text{no interior do toroide})$$\n4. **Placa Plana Infinita de Corrente com densidade linear $K = I/w$:**\n   $$B = \\frac{\\mu_0 K}{2}$$\n\n---\n\n## 🎯 7. GUIA RÁPIDO DAS REGRAS DA MÃO DIREITA (RMD)\n\n| Aplicação | Polegar | Dedos restantes | Palma / Vetor resultante |\n| :--- | :--- | :--- | :--- |\n| **Força $\\vec{F} = q\\vec{v}\\times\\vec{B}$** | Vetor Velocidade ($\\vec{v}$) | Vetor Campo ($\\vec{B}$) | Palma empurra $\\vec{F}$ (se $q > 0$). Se $q < 0$, inverta o sentido de $\\vec{F}$! |\n| **Força $\\vec{F} = I\\vec{L}\\times\\vec{B}$** | Sentido da Corrente ($I$) | Vetor Campo ($\\vec{B}$) | Palma empurra a força $\\vec{F}$. |\n| **Campo $\\vec{B}$ de Fio Reto** | Sentido da Corrente ($I$) | Abraçam o fio $\\to$ indicam o giro circular de $\\vec{B}$. | Tangente ao círculo em cada ponto. |\n| **Espira / Solenoide** | Aponta no sentido de $\\vec{\\mu}$ e $\\vec{B}$ no centro | Enrolam no sentido da corrente $I$ | O polegar indica o \"Polo Norte\" da espira. |\n";

    .custom-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #1e293b;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    .latex-content h1, .latex-content h2, .latex-content h3 {
      color: #38bdf8;
      font-weight: 700;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .latex-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    .latex-content th, .latex-content td {
      border: 1px solid #334155;
      padding: 8px 12px;
    }
    .latex-content th {
      background-color: #1e293b;
      color: #38bdf8;
    }
    .latex-content blockquote {
      border-left: 4px solid #38bdf8;
      background-color: #1e293b;
      padding: 8px 16px;
      margin: 12px 0;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [exams, setExams] = useState([]);
      const [selectedExam, setSelectedExam] = useState(null);
      const [answers, setAnswers] = useState({});
      const [currentPage, setCurrentPage] = useState(0);
      const [zoom, setZoom] = useState(100);
      const [timeLeft, setTimeLeft] = useState(7200); // 2 hours
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showCheatSheet, setShowCheatSheet] = useState(false);
      const [cheatSheetMarkdown, setCheatSheetMarkdown] = useState('');
      const [viewMode, setViewMode] = useState('single'); // 'single' or 'scroll'

      // Load exams and cheat sheet from embedded data (with fetch fallback)
      useEffect(() => {
        const data = window.EMBEDDED_EXAMS || [];
        setExams(data);
        if (data.length > 0) {
          const defaultExam = data.find(e => e.id.includes('24.1')) || data[0];
          setSelectedExam(defaultExam);
        }
        setCheatSheetMarkdown(window.EMBEDDED_CHEAT_SHEET || '');
      }, []);

      // Reset answers on exam change
      useEffect(() => {
        if (selectedExam) {
          setAnswers({});
          setCurrentPage(0);
          setIsSubmitted(false);
          setTimeLeft(7200);
          setIsTimerRunning(false);
        }
      }, [selectedExam]);

      // Timer effect
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timeLeft > 0 && !isSubmitted) {
          interval = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (timeLeft === 0 && !isSubmitted) {
          setIsSubmitted(true);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timeLeft, isSubmitted]);

      // KaTeX rendering inside cheat sheet modal
      useEffect(() => {
        if (showCheatSheet && window.renderMathInElement) {
          setTimeout(() => {
            const el = document.getElementById('cheat-sheet-content');
            if (el) {
              window.renderMathInElement(el, {
                delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false},
                  {left: '\\(', right: '\\)', display: false},
                  {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
              });
            }
          }, 100);
        }
      }, [showCheatSheet, cheatSheetMarkdown]);

      const formatTime = (seconds) => {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      };

      const handleSelectOption = (qIndex, option) => {
        if (isSubmitted) return;
        setAnswers(prev => ({
          ...prev,
          [qIndex]: prev[qIndex] === option ? null : option
        }));
        if (!isTimerRunning) {
          setIsTimerRunning(true);
        }
      };

      // Calculate score
      const calculateResult = () => {
        if (!selectedExam || !selectedExam.gabarito || selectedExam.gabarito.length === 0) {
          return { score: 0, total: selectedExam ? selectedExam.totalQuestions : 0, percentage: 0 };
        }
        const total = selectedExam.gabarito.length;
        let correct = 0;
        selectedExam.gabarito.forEach((g, idx) => {
          if (answers[idx] === g) {
            correct++;
          }
        });
        const percentage = Math.round((correct / total) * 100);
        const grade = ((correct / total) * 10).toFixed(1);
        return { correct, total, percentage, grade };
      };

      const result = isSubmitted ? calculateResult() : null;

      return (
        <div className="flex flex-col h-screen bg-slate-950 text-slate-100 select-none">
          {/* Top Navbar */}
          <header className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0 shadow-lg z-20">
            <div className="flex items-center space-x-4">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-500 flex items-center justify-center font-black text-xl text-white shadow-md shadow-cyan-500/20">
                F2
              </div>
              <div>
                <h1 className="font-bold text-lg text-white leading-tight flex items-center gap-2">
                  Simulador de Física 2 <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800/60">P2</span>
                </h1>
                <p className="text-xs text-slate-400">Banco de Provas & Gabarito Interativo</p>
              </div>
            </div>

            {/* Exam Selector */}
            <div className="flex items-center space-x-3">
              <label className="text-xs font-medium text-slate-400">Prova:</label>
              <select 
                value={selectedExam ? selectedExam.id : ''}
                onChange={(e) => {
                  const exam = exams.find(x => x.id === e.target.value);
                  setSelectedExam(exam);
                }}
                className="bg-slate-800 text-cyan-300 font-semibold text-sm rounded-lg px-3 py-1.5 border border-slate-700 hover:border-cyan-500/50 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all cursor-pointer shadow-inner"
              >
                {exams.map(e => (
                  <option key={e.id} value={e.id}>
                    {e.title} {e.gabarito.length > 0 ? `(${e.gabarito.length} questões com gabarito)` : ''}
                  </option>
                ))}
              </select>
            </div>

            {/* Timer & Actions */}
            <div className="flex items-center space-x-4">
              <div className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg font-mono text-sm font-bold border transition-all ${
                timeLeft < 600 
                  ? 'bg-rose-950/60 text-rose-400 border-rose-800 animate-pulse' 
                  : isTimerRunning 
                    ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800' 
                    : 'bg-slate-800 text-slate-300 border-slate-700'
              }`}>
                <span>⏱️</span>
                <span>{formatTime(timeLeft)}</span>
                <button 
                  onClick={() => setIsTimerRunning(!isTimerRunning)}
                  className="ml-1.5 text-xs text-slate-400 hover:text-white underline"
                >
                  {isTimerRunning ? 'Pausar' : 'Iniciar'}
                </button>
              </div>

              <button
                onClick={() => setShowCheatSheet(true)}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600/30 font-medium text-sm transition-all"
              >
                <span>📖</span> Resumo P2
              </button>

              {!isSubmitted ? (
                <button
                  onClick={() => {
                    if (confirm('Deseja realmente entregar e corrigir o cartão de respostas?')) {
                      setIsSubmitted(true);
                      setIsTimerRunning(false);
                    }
                  }}
                  className="px-4 py-1.5 rounded-lg bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-semibold text-sm shadow-md shadow-emerald-600/20 transition-all active:scale-95"
                >
                  Entregar Prova
                </button>
              ) : (
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setAnswers({});
                    setTimeLeft(7200);
                  }}
                  className="px-4 py-1.5 rounded-lg bg-cyan-700 hover:bg-cyan-600 text-white font-semibold text-sm transition-all"
                >
                  Refazer Prova
                </button>
              )}
            </div>
          </header>

          {/* Main Workspace: Left (PDF View) + Right (Bubble Sheet) */}
          <div className="flex-1 flex overflow-hidden">
            {/* Left: PDF Document Viewer */}
            <div className="flex-1 flex flex-col bg-slate-900/50 border-r border-slate-800 overflow-hidden">
              {/* Document Toolbar */}
              <div className="h-11 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 text-xs text-slate-300">
                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setCurrentPage(prev => Math.max(0, prev - 1))}
                    disabled={currentPage === 0 || viewMode === 'scroll'}
                    className="p-1.5 rounded hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent transition-all"
                    title="Página Anterior"
                  >
                    ◀ Anterior
                  </button>
                  <span className="font-semibold px-2">
                    Página {currentPage + 1} de {selectedExam ? selectedExam.totalPages : 1}
                  </span>
                  <button
                    onClick={() => setCurrentPage(prev => Math.min((selectedExam ? selectedExam.totalPages - 1 : 0), prev + 1))}
                    disabled={!selectedExam || currentPage >= selectedExam.totalPages - 1 || viewMode === 'scroll'}
                    className="p-1.5 rounded hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent transition-all"
                    title="Próxima Página"
                  >
                    Próxima ▶
                  </button>
                </div>

                {/* View Controls */}
                <div className="flex items-center space-x-4">
                  <div className="flex items-center bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                    <button
                      onClick={() => setViewMode('single')}
                      className={`px-2.5 py-1 rounded-md transition-all ${viewMode === 'single' ? 'bg-cyan-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      Página Única
                    </button>
                    <button
                      onClick={() => setViewMode('scroll')}
                      className={`px-2.5 py-1 rounded-md transition-all ${viewMode === 'scroll' ? 'bg-cyan-600 text-white font-bold' : 'text-slate-400 hover:text-white'}`}
                    >
                      Todas as Páginas
                    </button>
                  </div>

                  <div className="flex items-center space-x-1.5">
                    <button
                      onClick={() => setZoom(prev => Math.max(50, prev - 15))}
                      className="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded flex items-center justify-center font-bold"
                      title="Diminuir Zoom"
                    >
                      -
                    </button>
                    <span className="w-12 text-center font-mono font-bold text-cyan-400">{zoom}%</span>
                    <button
                      onClick={() => setZoom(prev => Math.min(200, prev + 15))}
                      className="w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded flex items-center justify-center font-bold"
                      title="Aumentar Zoom"
                    >
                      +
                    </button>
                    <button
                      onClick={() => setZoom(100)}
                      className="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-[11px]"
                    >
                      Reset
                    </button>
                  </div>
                </div>
              </div>

              {/* PDF Image Viewport */}
              <div className="flex-1 overflow-auto custom-scroll p-6 flex justify-center items-start bg-slate-950">
                {selectedExam ? (
                  viewMode === 'single' ? (
                    <div 
                      style={{ width: `${zoom}%`, maxWidth: `${zoom * 9}px` }} 
                      className="transition-all duration-150 shadow-2xl rounded-sm overflow-hidden bg-white border border-slate-700"
                    >
                      <img 
                        src={selectedExam.pages[currentPage]} 
                        alt={`Página ${currentPage + 1}`}
                        className="w-full h-auto block select-none pointer-events-none"
                        loading="eager"
                      />
                    </div>
                  ) : (
                    <div 
                      style={{ width: `${zoom}%`, maxWidth: `${zoom * 9}px` }} 
                      className="flex flex-col space-y-8 transition-all duration-150"
                    >
                      {selectedExam.pages.map((pg, idx) => (
                        <div key={idx} className="shadow-2xl rounded-sm overflow-hidden bg-white border border-slate-700">
                          <div className="bg-slate-800 text-slate-400 text-xs px-3 py-1 font-semibold border-b border-slate-700">
                            Página {idx + 1}
                          </div>
                          <img 
                            src={pg} 
                            alt={`Página ${idx + 1}`}
                            className="w-full h-auto block select-none pointer-events-none"
                            loading="lazy"
                          />
                        </div>
                      ))}
                    </div>
                  )
                ) : (
                  <div className="text-slate-500 m-auto text-center">
                    <p className="text-lg font-semibold">Nenhuma prova selecionada</p>
                  </div>
                )}
              </div>
            </div>

            {/* Right: Bubble Sheet & Score Panel */}
            <div className="w-96 bg-slate-900 flex flex-col shrink-0 overflow-hidden border-l border-slate-800 shadow-xl">
              {/* Bubble Sheet Header */}
              <div className="p-4 border-b border-slate-800 bg-slate-900/90">
                <div className="flex items-center justify-between">
                  <h2 className="font-bold text-sm text-slate-100 flex items-center gap-2">
                    <span>📝</span> Cartão Resposta
                  </h2>
                  <span className="text-xs bg-slate-800 text-cyan-400 font-semibold px-2.5 py-1 rounded-full border border-slate-700">
                    {Object.keys(answers).filter(k => answers[k] !== null).length} / {selectedExam ? selectedExam.totalQuestions : 15} marcadas
                  </span>
                </div>

                {/* Score Summary Box (when submitted) */}
                {isSubmitted && result && (
                  <div className="mt-3 p-3.5 rounded-xl bg-slate-950 border border-cyan-800/60 shadow-inner">
                    <div className="flex items-center justify-between mb-2">
                      <div>
                        <p className="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Resultado Final</p>
                        <p className="text-2xl font-black text-cyan-300">
                          {result.correct} <span className="text-sm font-normal text-slate-400">/ {result.total} acertos</span>
                        </p>
                      </div>
                      <div className="text-right">
                        <p className="text-[11px] text-slate-400 uppercase tracking-wider font-semibold">Nota</p>
                        <p className={`text-2xl font-black ${
                          parseFloat(result.grade) >= 6 ? 'text-emerald-400' : 'text-rose-400'
                        }`}>
                          {result.grade} <span className="text-xs text-slate-400">/ 10</span>
                        </p>
                      </div>
                    </div>

                    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div 
                        className={`h-full transition-all duration-500 rounded-full ${
                          result.percentage >= 60 ? 'bg-gradient-to-r from-teal-500 to-emerald-400' : 'bg-gradient-to-r from-amber-500 to-rose-500'
                        }`}
                        style={{ width: `${result.percentage}%` }}
                      ></div>
                    </div>
                    <p className="text-[11px] text-slate-400 mt-1.5 text-center font-medium">
                      Aproveitamento: <span className="text-cyan-300 font-bold">{result.percentage}%</span>
                    </p>
                  </div>
                )}
              </div>

              {/* Questions List */}
              <div className="flex-1 overflow-y-auto custom-scroll p-4 space-y-2.5">
                {selectedExam && Array.from({ length: selectedExam.totalQuestions }).map((_, idx) => {
                  const userAnswer = answers[idx];
                  const correctAnswer = selectedExam.gabarito && selectedExam.gabarito[idx];
                  const hasGabarito = !!correctAnswer;
                  
                  let statusClass = 'border-slate-800 bg-slate-950/60';
                  if (isSubmitted && hasGabarito) {
                    if (userAnswer === correctAnswer) {
                      statusClass = 'border-emerald-700/60 bg-emerald-950/20';
                    } else if (userAnswer) {
                      statusClass = 'border-rose-700/60 bg-rose-950/20';
                    } else {
                      statusClass = 'border-amber-700/60 bg-amber-950/20';
                    }
                  } else if (userAnswer) {
                    statusClass = 'border-cyan-800/60 bg-cyan-950/20';
                  }

                  return (
                    <div 
                      key={idx} 
                      className={`p-2.5 rounded-xl border transition-all duration-150 flex items-center justify-between ${statusClass}`}
                    >
                      {/* Question label */}
                      <div className="flex items-center space-x-2">
                        <span className="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-300 border border-slate-700">
                          {idx + 1}
                        </span>
                        {isSubmitted && hasGabarito && (
                          userAnswer === correctAnswer ? (
                            <span className="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800">
                              ✓ Correto
                            </span>
                          ) : (
                            <span className="text-xs font-bold text-rose-400 bg-rose-950/80 px-1.5 py-0.5 rounded border border-rose-800">
                              Gab: <strong className="text-white underline">{correctAnswer}</strong>
                            </span>
                          )
                        )}
                      </div>

                      {/* Options: A B C D E */}
                      <div className="flex items-center space-x-1.5">
                        {['A', 'B', 'C', 'D', 'E'].map(opt => {
                          const isSelected = userAnswer === opt;
                          const isCorrect = isSubmitted && correctAnswer === opt;
                          const isWrong = isSubmitted && isSelected && correctAnswer !== opt;

                          let btnStyle = 'bg-slate-800/80 text-slate-400 hover:bg-slate-700 hover:text-white border-slate-700';

                          if (isSubmitted) {
                            if (isCorrect) {
                              btnStyle = 'bg-emerald-600 text-white font-black border-emerald-400 ring-2 ring-emerald-400/40';
                            } else if (isWrong) {
                              btnStyle = 'bg-rose-600 text-white font-black line-through border-rose-400';
                            } else if (isSelected) {
                              btnStyle = 'bg-slate-700 text-slate-300';
                            }
                          } else if (isSelected) {
                            btnStyle = 'bg-cyan-500 text-slate-950 font-black border-cyan-300 shadow-md shadow-cyan-500/30 scale-105';
                          }

                          return (
                            <button
                              key={opt}
                              onClick={() => handleSelectOption(idx, opt)}
                              disabled={isSubmitted}
                              className={`w-8 h-8 rounded-lg text-xs font-bold border transition-all duration-100 flex items-center justify-center ${btnStyle}`}
                            >
                              {opt}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Bottom Quick Action */}
              <div className="p-3 bg-slate-950 border-t border-slate-800 flex justify-between items-center text-xs text-slate-400">
                <span>Clique na alternativa para marcar ou desmarcar.</span>
                {!isSubmitted && (
                  <button 
                    onClick={() => setAnswers({})}
                    className="text-rose-400 hover:text-rose-300 underline font-medium"
                  >
                    Limpar Tudo
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Modal: Cheat Sheet / Resumo P2 */}
          {showCheatSheet && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-6">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                {/* Modal Header */}
                <div className="h-14 bg-slate-800/80 border-b border-slate-700 flex items-center justify-between px-6 shrink-0">
                  <div className="flex items-center space-x-3">
                    <span className="text-xl">📖</span>
                    <h3 className="font-bold text-slate-100 text-base">Super Colinha & Formulário de Bolso (P2)</h3>
                  </div>
                  <button
                    onClick={() => setShowCheatSheet(false)}
                    className="w-8 h-8 rounded-lg bg-slate-700 hover:bg-rose-600 text-slate-300 hover:text-white flex items-center justify-center font-bold text-sm transition-all"
                  >
                    ✕
                  </button>
                </div>

                {/* Modal Content */}
                <div className="flex-1 overflow-y-auto custom-scroll p-8 text-sm text-slate-200 latex-content">
                  <div 
                    id="cheat-sheet-content"
                    dangerouslySetInnerHTML={{ __html: marked.parse(cheatSheetMarkdown || '# Carregando Resumo...') }}
                  />
                </div>

                {/* Modal Footer */}
                <div className="h-12 bg-slate-800 border-t border-slate-700 flex items-center justify-between px-6 text-xs text-slate-400 shrink-0">
                  <span>Dica: Use esta colinha no início para destravar as contas e depois simule no seco!</span>
                  <button
                    onClick={() => setShowCheatSheet(false)}
                    className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold rounded-lg transition-all"
                  >
                    Voltar para a Prova
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
